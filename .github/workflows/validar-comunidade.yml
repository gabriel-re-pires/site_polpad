name: Validar comunidade

# Roda com o código do PR, sem segredos e só com leitura. Confere o que depende do
# build (esquema, licença, imagens). Arquivos e caminhos ficam em conferir-envio.yml.
on:
  pull_request:
    paths:
      - 'comunidade/**'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Esquema e licença (build)
        run: npm run build
